# 深巷有喵的「Clash」上游同步规则
# 版本：1.4.2
# 日期：2026.11.02
# 作者：https://github.com/Rabbit-Spec/Clash

name: Auto-Clash-Rules

# 触发器配置
on:
  schedule:
    # 定时任务：北京时间每天 06:00 执行
    - cron: '0 22 * * *'
  # 允许手动触发
  workflow_dispatch:

# 权限配置
permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    
    # 强制所有 JavaScript Actions 使用 Node.js 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      # 步骤 1：检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤 2：下载、清洗、合并去重、统计并归档
      - name: Download, Merge and Filter Rules
        run: |
          # 创建输出目录及手动规则存储目录
          mkdir -p Rules/Manual
          
          # 获取北京时间
          UPDATE_TIME=$(TZ="Asia/Shanghai" date +"%Y.%m.%d %H:%M:%S")
          
          # 1. 定义标准处理函数
          process_rule() {
            local source_url=$1
            local target_name=$2
            local display_name=$3
            
            local target_path="Rules/$target_name"
            local filename_no_ext="${target_name%.*}"
            local manual_file="Rules/Manual/${filename_no_ext}.txt"
            local exclude_file="Rules/Manual/${filename_no_ext}.exclude.txt"
            
            temp_body=$(mktemp)
            temp_upstream=$(mktemp)
            
            # A. 提取并规范化手动追加规则 (去除回车、空行、payload声明及注释)
            if [ -f "$manual_file" ]; then
              local clean_manual
              clean_manual=$(sed 's/\r//g' "$manual_file" | awk 'tolower($0) !~ /^[[:space:]]*payload:/ && $0 !~ /^[[:space:]]*#/ && NF' | sed -E "s/^[[:space:]]*-?[[:space:]]*['\"]?//g; s/['\"]?[[:space:]]*$//g")
              
              # 仅在存在有效内容时写入，严格不添加尾部空行
              if [ -n "$clean_manual" ]; then
                echo "# ======= 手动维护规则 ========" >> "$temp_body"
                echo "$clean_manual" >> "$temp_body"
              fi
            fi
            
            # B. 下载并清洗上游规则
            echo "# ======= 上游同步规则 ========" >> "$temp_body"
            if curl -fsL "$source_url" | sed 's/\r//g' | awk 'tolower($0) !~ /^[[:space:]]*payload:/ && $0 !~ /^[[:space:]]*#/ && NF' | sed -E "s/^[[:space:]]*-?[[:space:]]*['\"]?//g; s/['\"]?[[:space:]]*$//g" > "$temp_upstream"; then
              # 如果存在排除文件，必须预先剔除其内部的空行与回车，防止 grep 误清空全部规则
              if [ -f "$exclude_file" ] && [ -s "$exclude_file" ]; then
                local valid_excludes
                valid_excludes=$(sed 's/\r//g' "$exclude_file" | grep -v '^[[:space:]]*$' || true)
                if [ -n "$valid_excludes" ]; then
                  grep -vFf <(echo "$valid_excludes") "$temp_upstream" >> "$temp_body" || true
                else
                  cat "$temp_upstream" >> "$temp_body"
                fi
              else
                cat "$temp_upstream" >> "$temp_body"
              fi
            else
              echo "Warning: Failed to download $source_url"
            fi
            
            # C. 合并去重 (保留注释顺序，去除正文完全重复的行)
            awk '/^#|^[[:space:]]*$/ {print; next} !seen[$0]++' "$temp_body" > "${temp_body}.tmp" && mv "${temp_body}.tmp" "$temp_body"
            
            # D. 统计有效规则条数 (排除注释和空白)
            local rule_count=$(awk '$0 !~ /^[[:space:]]*#/ && NF' "$temp_body" | wc -l)
            
            # E & F. 构造最终 YAML 文件 (Header + payload + awk 毫秒级流式缩进)
            {
              echo "# NAME: $display_name"
              echo "# AUTHOR: Rabbit-Spec"
              echo "# REPO: https://github.com/Rabbit-Spec/Clash"
              echo "# UPDATED: $UPDATE_TIME"
              echo "# TOTAL: $rule_count"
              echo ""
              echo "payload:"
              awk '{
                if ($0 ~ /^#/) {
                  print "  " $0
                } else if ($0 ~ /^[[:space:]]*$/) {
                  print ""
                } else {
                  print "  - " $0
                }
              }' "$temp_body"
            } > "$target_path"
            
            rm -f "$temp_body" "$temp_upstream"
          }
            
            # F. 统一按 YAML 格式化写入 (已移出单引号，注释和空行均自动缩进)
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ "$line" =~ ^# ]]; then
                echo "  $line" >> "$target_path"
              elif [ -z "$line" ]; then
                echo "" >> "$target_path"
              else
                echo "  - $line" >> "$target_path"
              fi
            done < "$temp_body"
            
            rm -f "$temp_body" "$temp_upstream"
          }
          
          # --- 第一部分：常规规则同步 ---
          # Loyalsoldier 仓库
          URL_PROXY="https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt"
          process_rule "$URL_PROXY" "ChinaCIDR.yaml" "深巷有喵的「ChinaCIDR」规则"

          URL_PROXY="https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"
          process_rule "$URL_PROXY" "China.yaml" "深巷有喵的「China」规则"

          # Sukka 仓库
          URL_PROXY="https://ruleset.skk.moe/Clash/ip/telegram.txt"
          process_rule "$URL_PROXY" "Telegram.yaml" "深巷有喵的「Telegram」规则"

          URL_PROXY="https://ruleset.skk.moe/Clash/non_ip/ai.txt"
          process_rule "$URL_PROXY" "AIGC.yaml" "深巷有喵的「AIGC」规则"

          # MagicRule 仓库
          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Apple_classical_0fa29647e779e764.yaml"
          process_rule "$URL_PROXY" "Apple.yaml" "深巷有喵的「Apple」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Google_classical_fe2edb12daf1b32f.yaml"
          process_rule "$URL_PROXY" "Google.yaml" "深巷有喵的「Google」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Instagram_classical_8f2bea3580d2acf2.yaml"
          process_rule "$URL_PROXY" "Instagram.yaml" "深巷有喵的「Instagram」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Facebook_classical_041e2b1a05aace8f.yaml"
          process_rule "$URL_PROXY" "Facebook.yaml" "深巷有喵的「Facebook」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Microsoft_classical_e67099aa280f921f.yaml"
          process_rule "$URL_PROXY" "Microsoft.yaml" "深巷有喵的「Microsoft」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/YouTube_classical_59b6d0fe3b15c19e.yaml"
          process_rule "$URL_PROXY" "YouTube.yaml" "深巷有喵的「YouTube」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Netflix_classical_c2f68b0a92395ef4.yaml"
          process_rule "$URL_PROXY" "Netflix.yaml" "深巷有喵的「Netflix」规则"

          URL_PROXY="https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney_No_Resolve.yaml"
          process_rule "$URL_PROXY" "Disney.yaml" "深巷有喵的「Disney」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Spotify_classical_822ce41d873a2ee4.yaml"
          process_rule "$URL_PROXY" "Spotify.yaml" "深巷有喵的「Spotify」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/TikTok_classical_c510421d706b99d3.yaml"
          process_rule "$URL_PROXY" "TikTok.yaml" "深巷有喵的「TikTok」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/BiliBili_classical_e094628621c39bfc.yaml"
          process_rule "$URL_PROXY" "BiliBili.yaml" "深巷有喵的「BiliBili」规则" 

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/ChinaMedia_classical_5eda3320a55c6422.yaml"
          process_rule "$URL_PROXY" "ChinaMedia.yaml" "深巷有喵的「ChinaMedia」规则" 
          
          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/GlobalMedia_classical_f0880cec2c24ebd6.yaml"
          process_rule "$URL_PROXY" "GlobalMedia.yaml" "深巷有喵的「GlobalMedia」规则" 

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/PayPal_classical_3d035a8c84b7c305.yaml"
          process_rule "$URL_PROXY" "PayPal.yaml" "深巷有喵的「PayPal」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Whatsapp_classical_cd2dafda3f58a9b4.yaml"
          process_rule "$URL_PROXY" "Whatsapp.yaml" "深巷有喵的「Whatsapp」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Lan_classical_c34e1546d84707e3.yaml"
          process_rule "$URL_PROXY" "LAN.yaml" "深巷有喵的「LAN」规则"
          
          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/GlobalGame_classical_f8d067b0c35d9641.yaml"
          process_rule "$URL_PROXY" "Game.yaml" "深巷有喵的「Game」规则"

          # --- 第二部分：Proxy.yaml 聚合处理 ---
          PROXY_TARGET="Rules/Proxy.yaml"
          PROXY_EXCLUDE="Rules/Manual/Proxy.exclude.txt"
          PROXY_MANUAL="Rules/Manual/Proxy.txt"
          proxy_temp=$(mktemp)
          
          # A. Proxy 手动规则
          if [ -f "$PROXY_MANUAL" ] && [ -s "$PROXY_MANUAL" ]; then
            echo "# ======= 手动维护规则 ========" >> "$proxy_temp"
            awk 'tolower($0) !~ /payload:/ && $0 !~ /^[[:space:]]*#/ && NF' "$PROXY_MANUAL" | sed -E "s/^[[:space:]]*-?[[:space:]]*['\"]?//g; s/['\"]?[[:space:]]*$//g" >> "$proxy_temp"
          fi
          
          # B. Proxy 聚合源
          PROXY_SUBS=(
            "Telegram|https://ruleset.skk.moe/Clash/non_ip/telegram.txt"
            "Proxy|https://magicrule.pages.dev/data/_shared/artifacts/Global_classical_84d7c926159da35f.yaml"
          )
          
          for sub in "${PROXY_SUBS[@]}"; do
            name="${sub%%|*}"
            url="${sub#*|}"
            echo "# ======= $name ========" >> "$proxy_temp"
            temp_sub=$(mktemp)
            if curl -fsL "$url" | awk 'tolower($0) !~ /payload:/ && $0 !~ /^[[:space:]]*#/ && NF' | sed -E "s/^[[:space:]]*-?[[:space:]]*['\"]?//g; s/['\"]?[[:space:]]*$//g" > "$temp_sub"; then
              if [ -f "$PROXY_EXCLUDE" ] && [ -s "$PROXY_EXCLUDE" ]; then
                grep -vFf "$PROXY_EXCLUDE" "$temp_sub" >> "$proxy_temp" || true
              else
                cat "$temp_sub" >> "$proxy_temp"
              fi
            else
              echo "Warning: Failed to download $url"
            fi
            rm -f "$temp_sub"
          done
          
          # C. 合并去重
          sed -i 's/\r//g' "$proxy_temp"
          awk '/^#|^[[:space:]]*$/ {print; next} !seen[$0]++' "$proxy_temp" > "${proxy_temp}.tmp" && mv "${proxy_temp}.tmp" "$proxy_temp"

          # D. 统计 Proxy 规则数
          proxy_count=$(awk '$0 !~ /^[[:space:]]*#/ && NF' "$proxy_temp" | wc -l)
          
          # E. 写入 Proxy.yaml 最终文件 (按 YAML 格式化输出)
          echo "# NAME: 深巷有喵的「Proxy」规则" > "$PROXY_TARGET"
          echo "# AUTHOR: Rabbit-Spec" >> "$PROXY_TARGET"
          echo "# REPO: https://github.com/Rabbit-Spec/Clash" >> "$PROXY_TARGET"
          echo "# UPDATED: $UPDATE_TIME" >> "$PROXY_TARGET"
          echo "# TOTAL: $proxy_count" >> "$PROXY_TARGET"
          echo "" >> "$PROXY_TARGET"
          echo "payload:" >> "$PROXY_TARGET"
          
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ "$line" =~ ^# ]]; then
              echo "  $line" >> "$PROXY_TARGET"
            elif [ -z "$line" ]; then
              echo "" >> "$PROXY_TARGET"
            else
              echo "  - $line" >> "$PROXY_TARGET"
            fi
          done < "$proxy_temp"
          rm -f "$proxy_temp"

      # 步骤 3：Git 提交与推送到远程仓库
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Rules/
          if ! git diff --staged --quiet; then
            COMMIT_TIME=$(TZ="Asia/Shanghai" date +"%Y.%m.%d %H:%M:%S")
            git commit -m "$COMMIT_TIME Update"
            git push
          fi
